[project]
name = "digital-diary-application"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "email-validator>=2.3.0",
    "bcrypt<5",
    "webauthn>=2.5,<3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "PyJWT>=2.10.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.43",
    "alembic>=1.16.4",
    "uvicorn>=0.51.0",
    "pywebpush>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "respx>=0.22.0",
]
e2e = [
    "pytest>=8.0.0",
    "playwright>=1.48.0",
    "pytest-playwright>=0.5.2",
]

[tool.pytest.ini_options]
# Only the fast, in-process TestClient suite runs by default (`pytest`
# with no args). tests/e2e boots a real server + real Chromium per test
# and takes minutes, not seconds -- run it explicitly with
# `pytest tests/e2e` (see tests/e2e/README.md), not as a side effect of
# a routine `pytest` during normal development.
testpaths = ["tests"]
addopts = "--ignore=tests/e2e"
