[project]
name = "digital-diary-application"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.2",
    "email-validator>=2.3.0",
    "bcrypt<5",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "PyJWT>=2.10.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.43",
    "alembic>=1.16.4",
    "uvicorn>=0.51.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "respx>=0.22.0",
]
