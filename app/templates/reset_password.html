{% block body %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Set a new password — Digital Diary</title>
  <meta name="csrf-token" content="{{ csrf_token or '' }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body>

<div class="grain-overlay" aria-hidden="true"></div>
<div class="ambient-glow g1" aria-hidden="true"></div>
<div class="ambient-glow g2" aria-hidden="true"></div>
<div class="ambient-motes" id="ambientMotes" aria-hidden="true"></div>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-body);padding:1.5rem;position:relative;">
  <div style="width:100%;max-width:460px;position:relative;z-index:2;">

    <div style="text-align:center;margin-bottom:2rem;">
      <a href="/" style="text-decoration:none;">
        <span style="font-size:2.5rem;display:block;margin-bottom:0.5rem;">📖</span>
        <span style="font-family:var(--font-display);font-size:1.4rem;font-weight:700;color:var(--txt-primary);">Digital Diary</span>
      </a>
    </div>

    <div class="card card-paper" style="padding:2rem;position:relative;">
      <div style="position:absolute;top:1rem;right:1rem;">
        <button class="theme-toggle" aria-label="Toggle theme"><i class="bi bi-moon-fill"></i></button>
      </div>

      <div style="text-align:center;margin-bottom:1.75rem;">
        <h1 style="font-family:var(--font-display);font-size:1.6rem;font-weight:700;letter-spacing:-.02em;margin-bottom:0.25rem;">Reset your password</h1>
        <p style="font-family:var(--font-serif);font-style:italic;color:var(--txt-secondary);font-size:0.9rem;margin:0;">Enter the 6-digit code we emailed you</p>
      </div>

      <form id="resetPwForm" novalidate>

        <div class="form-group" style="margin-bottom:1rem;">
          <label class="form-label" for="rp-identifier">Username or email</label>
          <div class="input-icon-wrap">
            <i class="bi bi-person input-icon-prefix"></i>
            <input class="form-control" id="rp-identifier" placeholder="yourname or you@example.com" required autocomplete="username">
          </div>
        </div>

        <div class="form-group" style="margin-bottom:1rem;">
          <label class="form-label" for="rp-code">Verification code</label>
          <div class="input-icon-wrap">
            <i class="bi bi-shield-lock input-icon-prefix"></i>
            <input class="form-control" id="rp-code" inputmode="numeric" maxlength="6" placeholder="123456" required
                   style="letter-spacing:0.3em;font-weight:700;" autocomplete="one-time-code">
          </div>
          <div class="form-feedback" id="rp-code-fb" aria-live="polite"></div>
        </div>

        <div class="form-group" style="margin-bottom:1rem;">
          <label class="form-label" for="rp-new">New password</label>
          <div class="input-icon-wrap">
            <i class="bi bi-lock input-icon-prefix"></i>
            <input class="form-control" id="rp-new" type="password" required autocomplete="new-password" minlength="8">
            <button type="button" class="input-icon-toggle" data-toggle-for="rp-new" aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div>
          <div class="pw-strength-track" id="rp-strength-track" style="margin-top:.5rem;"><div class="pw-strength-fill" id="rp-strength-fill"></div></div>
        </div>

        <div class="form-group" style="margin-bottom:1.5rem;">
          <label class="form-label" for="rp-confirm">Confirm new password</label>
          <div class="input-icon-wrap">
            <i class="bi bi-lock-fill input-icon-prefix"></i>
            <input class="form-control" id="rp-confirm" type="password" required autocomplete="new-password">
          </div>
          <div class="form-feedback" id="rp-confirm-fb" aria-live="polite"></div>
        </div>

        <button class="btn btn-primary" style="width:100%;min-height:48px;" id="resetPwBtn" type="button">
          <i class="bi bi-check-circle"></i> Set new password
        </button>

        <div style="text-align:center;margin-top:1rem;">
          <a href="/forgot-password" style="font-size:0.82rem;color:var(--txt-muted);">
            Didn't get a code? Request a new one
          </a>
        </div>
      </form>

      <div id="resetPwSuccess" style="display:none;text-align:center;">
        <div style="font-size:3rem;margin-bottom:1rem;">✅</div>
        <h2 style="font-family:var(--font-display);font-size:1.3rem;font-weight:700;margin-bottom:.5rem;">Password changed</h2>
        <p style="font-family:var(--font-serif);font-style:italic;color:var(--txt-secondary);margin-bottom:1.5rem;">You can now sign in with your new password.</p>
        <a href="/login" class="btn btn-primary" style="min-height:48px;display:inline-flex;">Sign in</a>
      </div>
    </div>
  </div>
</div>

<script>
  // Pre-fill the identifier if we just came from the "forgot password" step.
  try {
    const saved = sessionStorage.getItem("dd-reset-identifier");
    if (saved) document.getElementById("rp-identifier").value = saved;
  } catch {}
</script>
<script src="{{ url_for('static', path='js/app.js') }}"></script>
<script src="{{ url_for('static', path='js/motion.js') }}"></script>
</body>
</html>
{% endblock %}
